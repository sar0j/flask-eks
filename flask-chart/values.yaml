# Application settings
app:
  name: flask-app
  version: "1.0.0"
  replicas: 4

# Container image
image:
  repository: 093487859784.dkr.ecr.ap-southeast-2.amazonaws.com/flask-app
  tag: 2007f10b19169ab8a3faa96866a04cfb592ce338
  pullPolicy: Always

# Database settings
database:
  host: "three-tier-db.cfs4mq02ws7s.ap-southeast-2.rds.amazonaws.com"
  name: "threetierdb"
  user: "admin"
  password: "YOUR-PASSWORD"

# Service settings
service:
  type: LoadBalancer
  port: 80
  targetPort: 5000

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Auto scaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 50

# Health check
healthCheck:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10

# Namespace
namespace: three-tier
